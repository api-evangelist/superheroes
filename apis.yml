apis:
  - name: Superhero API
    description: >-
      The Superhero API is a static JSON REST surface that returns a single consolidated dataset of 731 characters or
      per-character / per-property records. All responses are pre-built JSON files served from GitHub Pages
      (akabab.github.io) with a jsDelivr CDN mirror. Endpoints cover the full character record (/id/{id}.json) and
      individual property slices (powerstats, appearance, biography, work, connections), plus a bulk /all.json file
      containing every character. A separate image surface serves four sizes (xs, sm, md, lg) per character slug.
    humanURL: https://akabab.github.io/superhero-api/api/
