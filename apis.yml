features:
  - name: Bulk Character Dataset
    description: >-
      The /all.json endpoint returns all 731 character records in a single response — ideal for clients that want to
      load and cache the dataset once and query it locally.
  - name: Per-Character Records
    description: The /id/{id}.json endpoint returns a complete record for a single character keyed by numeric id (1..731).
  - name: Per-Property Slices
    description: >-
      Property-specific endpoints (/powerstats, /appearance, /biography, /work, /connections) return just one
      sub-document, which lets bandwidth-sensitive clients fetch only what they need.
  - name: Multi-Resolution Images
    description: >-
      Each character has four image sizes — xs, sm, md, lg — keyed by the character slug (e.g. `1-a-bomb.jpg`), served
      as static JPGs from GitHub Pages and jsDelivr.
  - name: Powerstats Scoring
    description: >-
      Every character has a six-axis powerstats vector — intelligence, strength, speed, durability, power, combat —
      scored 0-100, suitable for ranking, filtering, and comparison.
  - name: Alignment Classification
    description: >-
      Each biography includes an alignment tag (good, bad, neutral) so clients can split the catalog into heroes,
      villains, and antiheroes.
  - name: Cross-Publisher Coverage
    description: >-
      The dataset spans Marvel Comics, DC Comics, Dark Horse Comics, Image Comics, Wildstorm, Star Trek, IDW, Sony
      Pictures, Universal Studios, and several other publishers — accessible via the biography.publisher field.
  - name: No Authentication
    description: >-
      All endpoints are unauthenticated GETs. No API key, OAuth, or account sign-up is required, in contrast with the
      upstream superheroapi.com which requires a free token.
  - name: CDN-Backed Static JSON
    description: >-
      Files are pre-built and served from GitHub Pages with a jsDelivr CDN mirror, so clients get edge-cached responses
      with no origin server to rate-limit them.
  - name: Open Source Dataset
    description: >-
      The full builder pipeline, sources, and images are MIT-licensed on GitHub, so the dataset can be forked,
      augmented, and redeployed.
useCases:
  - name: Frontend Tutorial Fixture
    description: >-
      Zero-friction REST API used in JavaScript / React / Vue tutorials to demonstrate fetch, list rendering, image
      loading, and detail pages without bringing up a backend.
  - name: Game and Battle Simulators
    description: >-
      The powerstats vector is widely used to build superhero battle simulators, top-trumps style card games, and
      ranking experiments.
  - name: Data Visualization Demos
    description: >-
      Cross-publisher, multi-axis powerstats data is a common dataset for D3, Observable, and Tableau tutorials showing
      radar charts, scatter plots, and comparative analytics.
  - name: Machine Learning Toy Dataset
    description: >-
      Small (731-row), well-structured, mixed-type dataset useful for teaching classification (alignment), regression
      (powerstats), and embedding (text fields like aliases and connections).
  - name: Chatbot and LLM Demos
    description: >-
      Used as a stable JSON corpus for retrieval-augmented chatbots and agent demos that answer "who is X?" or "compare
      X vs Y" questions.
  - name: Mobile App Sample Data
    description: iOS and Android tutorials use the character + image surface as a ready-made backend for list/detail UX patterns.
integrations:
  - name: GitHub Pages
    description: Origin host for the static JSON files and image assets.
  - name: jsDelivr CDN
    description: Public CDN mirror at cdn.jsdelivr.net/gh/akabab/superhero-api for faster delivery.
