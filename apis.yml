aid: superheroes
name: Superhero API (akabab)
description: >-
  Open-source REST API exposing 731 superheroes and villains drawn from multiple comic universes (Marvel, DC, Dark
  Horse, Image, and more) under a single, unauthenticated JSON surface. The dataset is rebuilt from the original
  superheroapi.com source, cleaned up, and republished as static JSON files served from GitHub Pages and the jsDelivr
  CDN. Each character includes powerstats, appearance, biography, work, connections, and a multi-resolution image set.
url: https://akabab.github.io/superhero-api/api/
