openapi: 3.0.3
info:
  title: Superhero API (akabab) Appearance Powerstats API
  description: 'Open-source static REST API exposing 731 superheroes and villains from

    multiple comic universes (Marvel, DC, Dark Horse, Image, and more) as

    pre-built JSON files served from GitHub Pages and the jsDelivr CDN.

    All endpoints are unauthenticated GETs.

    '
  version: 0.3.0
  contact:
    name: akabab/superhero-api
    url: https://github.com/akabab/superhero-api
  license:
    name: MIT
    url: https://github.com/akabab/superhero-api/blob/master/LICENSE
servers:
- url: https://akabab.github.io/superhero-api/api
  description: Primary origin (GitHub Pages)
- url: https://cdn.jsdelivr.net/gh/akabab/superhero-api@0.3.0/api
  description: jsDelivr CDN mirror
tags:
- name: Powerstats
  description: Per-character powerstats slices (intelligence, strength, etc.).
paths:
  /powerstats/{id}.json:
    get:
      operationId: getCharacterPowerstats
      summary: Get Character Powerstats
      description: Returns just the powerstats slice for a single character.
      tags:
      - Powerstats
      parameters:
      - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: The character's powerstats sub-document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Powerstats'
        '404':
          description: No character with the supplied id exists.
components:
  schemas:
    Powerstats:
      type: object
      description: Six-axis powerstats vector scored 0-100 (null if unknown).
      properties:
        intelligence:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        strength:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        speed:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        durability:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        power:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
        combat:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
  parameters:
    CharacterId:
      name: id
      in: path
      required: true
      description: Numeric character id, 1..731.
      schema:
        type: integer
        minimum: 1
        maximum: 731
